name: Pendo Verification (Simple)

on:
  pull_request:
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'tests/**/*.ts'
      - 'tests/**/*.tsx'
      - 'scripts/verify-pendo-ci.js'
      - 'package.json'
      - 'tsconfig.json'
  push:
    branches:
      - main
      - develop

jobs:
  verify-pendo:
    name: Verify Pendo Integration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Pendo Verification
        run: npm run verify

